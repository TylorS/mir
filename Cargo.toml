[workspace]
members = [
  "crates/ast",
  "crates/backend-js",
  "crates/backend-wasi", 
  # "crates/backend-wasm",  # Temporarily disabled due to NAPI issues
  "crates/compiler",
  "crates/runtime",
  "crates/types",
  "crates/vm",
  # "mir-runtime-assembly",  # Temporarily disabled due to missing trait definitions
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
opentelemetry = "0.30"
opentelemetry_sdk = "0.30"
opentelemetry-jaeger = "0.22"
tracing = "0.1"
tracing-opentelemetry = "0.22"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"

# NAPI dependencies for Node.js bindings
napi = { version = "2.16", features = ["napi8", "async"] }
napi-derive = "2.16"

# WASM runtime dependencies
wasmtime = "25.0"
wasmtime-wasi = "25.0"

# Additional utilities
once_cell = "1.19"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
