[workspace]
members = [
  "crates/ast",
  "crates/backend-js",
  "crates/backend-wasi", 
  "crates/backend-wasm",
  "crates/compiler",
  "crates/runtime",
  "crates/types",
  "crates/vm",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
